name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Notebooks run top to bottom
        env:
          MPLBACKEND: Agg
        run: |
          for nb in JupyterCodes/*.ipynb; do
            echo "== $nb"
            python -c "import sys, nbformat; from nbclient import NotebookClient; nb = nbformat.read(sys.argv[1], as_version=4); NotebookClient(nb, timeout=300, resources={'metadata': {'path': 'JupyterCodes'}}).execute()" "$nb"
          done
